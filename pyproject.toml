[project]
name = "ner-recovery"
version = "0.1.0"
description = "Redaction recovery via named entity inference"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "spacy>=3.7",
    "wikipedia-api>=0.6",
    "tqdm>=4.66",
    "mwparserfromhell>=0.6",
]

[project.scripts]
build-corpus = "ner_recovery.corpus:main"
train = "ner_recovery.train:main"
evaluate = "ner_recovery.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ner_recovery"]
