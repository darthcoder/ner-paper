[project]
name = "engrammatic-nei"
version = "0.1.0"
description = "Engrammatic Named Entity Inference — probing latent entity knowledge via typed mask recovery"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "spacy>=3.7",
    "wikipedia-api>=0.6",
    "tqdm>=4.66",
    "mwparserfromhell>=0.6",
    "anthropic>=0.40",
]

[project.scripts]
build-corpus = "ner_recovery.corpus:main"
train = "ner_recovery.train:main"
evaluate = "ner_recovery.eval:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ner_recovery"]
